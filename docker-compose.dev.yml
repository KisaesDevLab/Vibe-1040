# Development overlay. Use with:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis
#
# Publishes Postgres and Redis to localhost so the API and worker can run on the host,
# where `@kisaes/vibe-ai-client` is linked from a local Vibe-AI-Router checkout
# (scripts/link-sdk.mjs). The appliance image installs the SDK from the private registry
# instead, so this overlay is never used in a real deployment.
#
# Ports bind to 127.0.0.1 only. Never 0.0.0.0 — this is a database holding taxpayer data.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"
