name: Release

# Publishes the appliance and sidecar images to GHCR on a version tag.
#
#   git tag -a v0.0.1 -m "..." && git push origin v0.0.1
#
# Both images are tagged with the version, the major.minor, and `latest`, so a compose file
# can pin as tightly or as loosely as the operator wants.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to build (e.g. v0.0.1)'
        required: true

env:
  REGISTRY: ghcr.io
  ROUTER_REPO: KisaesDevLab/Vibe-AI-Router

jobs:
  # Never publish an image whose tests do not pass. A tag is not a reason to skip the gate.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/check-provider-leakage.mjs
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.ROUTER_REPO }}
          path: .router
          sparse-checkout: packages/sdk
      - run: node scripts/install-deps.mjs --sdk .router/packages/sdk
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # The Docker build cannot reach the private SDK, so vendor it into the build context.
      - name: Vendor the router SDK
        uses: actions/checkout@v5
        with:
          repository: ${{ env.ROUTER_REPO }}
          path: .router
          sparse-checkout: packages/sdk

      - name: Stage vendor/sdk
        run: |
          mkdir -p vendor
          cp -r .router/packages/sdk vendor/sdk
          rm -rf .router

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Appliance image metadata
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Vibe 1040
            org.opencontainers.image.description=1040 source-document worksheet appliance
            org.opencontainers.image.vendor=Kisaes

      - name: Build and push the appliance
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sidecar image metadata
        id: meta-sidecar
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-sidecar
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Vibe 1040 sidecar
            org.opencontainers.image.description=PyMuPDF rasterization and text-layer triage
            org.opencontainers.image.vendor=Kisaes

      - name: Build and push the sidecar
        uses: docker/build-push-action@v7
        with:
          context: ./sidecar
          push: true
          tags: ${{ steps.meta-sidecar.outputs.tags }}
          labels: ${{ steps.meta-sidecar.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A pushed image that nobody can pull is not a release.
      #
      # The Vibe Appliance decides whether an app can be enabled by asking GHCR's
      # anonymous token endpoint whether the image is publicly pullable
      # (console/server.js::checkGhcrPublished). A private package fails that check
      # exactly like a nonexistent one, so v0.0.1 published successfully and was still
      # unusable — the console showed "image not published" and the Enable button stayed
      # disabled. Nothing in the pipeline noticed, because pushing had worked.
      #
      # This step performs the appliance's own check and fails the release if it does not
      # pass, so the failure surfaces here rather than on a droplet weeks later.
      - name: Verify the images are anonymously pullable
        run: |
          fail=0
          owner="${{ github.repository_owner }}"
          for repo in "$owner/vibe-1040" "$owner/vibe-1040-sidecar"; do
            lower=$(echo "$repo" | tr '[:upper:]' '[:lower:]')
            body=$(curl -sf "https://ghcr.io/token?scope=repository:${lower}:pull" || echo '{}')
            if echo "$body" | grep -q '"token"'; then
              echo "OK   $lower is anonymously pullable"
            else
              echo "FAIL $lower is NOT anonymously pullable"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            {
              echo "### Release incomplete — images are not anonymously pullable"
              echo
              echo "The images pushed, but GHCR will not serve them to an anonymous puller,"
              echo "so the Vibe Appliance console will show **image not published** and the"
              echo "Enable button will stay disabled."
              echo
              echo "**Cause.** A GHCR package inherits its repository's visibility when it is"
              echo "first created, and this repository is private."
              echo
              echo "**Fix — one time, in the web UI.** Package visibility cannot be changed"
              echo "through the REST API; it is a package setting:"
              echo
              echo "- https://github.com/users/${{ github.repository_owner }}/packages/container/vibe-1040/settings"
              echo "- https://github.com/users/${{ github.repository_owner }}/packages/container/vibe-1040-sidecar/settings"
              echo
              echo "Danger Zone → Change visibility → Public. Visibility is sticky, so every"
              echo "later release stays public and this step passes from then on."
              echo
              echo "The repository itself can stay private. The images carry only compiled"
              echo "code, the built review UI, and the form-schema and mapping data — no docs,"
              echo "no .env, and not the WISP amendment."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "### Images published and anonymously pullable"
            echo
            echo '```'
            echo "${{ steps.meta-api.outputs.tags }}"
            echo "${{ steps.meta-sidecar.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
