name: Release

# Publishes the appliance and sidecar images to GHCR on a version tag.
#
#   git tag -a v0.0.1 -m "..." && git push origin v0.0.1
#
# Both images are tagged with the version, the major.minor, and `latest`, so a compose file
# can pin as tightly or as loosely as the operator wants.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to build (e.g. v0.0.1)'
        required: true

env:
  REGISTRY: ghcr.io
  ROUTER_REPO: KisaesDevLab/Vibe-AI-Router

jobs:
  # Never publish an image whose tests do not pass. A tag is not a reason to skip the gate.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Same database as ci.yml, for the same reason: the database-backed tests skip themselves
    # without one, a skip is green, and this job is the gate in front of a published image. The
    # tests that prove the MFA gate on single sign-on (§11, Q18) must run here, not only on PRs.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vibe1040
          POSTGRES_PASSWORD: vibe1040
          POSTGRES_DB: vibe1040_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vibe1040 -d vibe1040_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          # @kisaesdevlab/vibe-auth lives on GitHub Packages, which wants a token even to read.
          # This writes a runner-level npmrc that expands NODE_AUTH_TOKEN at install time.
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kisaesdevlab'
      - run: node scripts/check-provider-leakage.mjs
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.ROUTER_REPO }}
          path: .router
          sparse-checkout: packages/sdk
      - run: node scripts/install-deps.mjs --sdk .router/packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - name: Migrate the test database (up, down, up)
        run: npm run db:migrate && npm run db:rollback && npm run db:migrate
        env:
          DATABASE_URL: postgres://vibe1040:vibe1040@localhost:5432/vibe1040_test
          REDIS_URL: redis://localhost:6379
          VIBE_AI_ROUTER_URL: http://vibe-ai-router:8220
          VIBE_AI_TOKEN: test-token-not-a-real-credential
          ROUTER_REQUIRE_US_REGION: 'false'
          TIN_HASH_SALT: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
          SESSION_SECRET: CAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg=
          STORAGE_ENCRYPTION_KEY: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
          if grep -E "test database unavailable" test-output.log; then
            echo "::error::database-backed tests skipped — refusing to publish an image whose MFA-gate tests did not run"
            exit 1
          fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # The Docker build cannot reach the private SDK, so vendor it into the build context.
      - name: Vendor the router SDK
        uses: actions/checkout@v5
        with:
          repository: ${{ env.ROUTER_REPO }}
          path: .router
          sparse-checkout: packages/sdk

      - name: Stage vendor/sdk
        run: |
          mkdir -p vendor
          cp -r .router/packages/sdk vendor/sdk
          rm -rf .router

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Appliance image metadata
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Vibe 1040
            org.opencontainers.image.description=1040 source-document worksheet appliance
            org.opencontainers.image.vendor=Kisaes

      - name: Build and push the appliance
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # The registry token for @kisaesdevlab/vibe-auth, as a BuildKit secret: mounted for
          # the install steps only, never an ARG or ENV, so it is in no layer and no history.
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sidecar image metadata
        id: meta-sidecar
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-sidecar
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Vibe 1040 sidecar
            org.opencontainers.image.description=PyMuPDF rasterization and text-layer triage
            org.opencontainers.image.vendor=Kisaes

      - name: Build and push the sidecar
        uses: docker/build-push-action@v7
        with:
          context: ./sidecar
          push: true
          tags: ${{ steps.meta-sidecar.outputs.tags }}
          labels: ${{ steps.meta-sidecar.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── the OpenTax engine image (P17) ───────────────────────────────────────
      #
      # `docker-compose.yml` has pointed its `opentax` service at
      # `ghcr.io/…/vibe-1040-opentax:${VIBE_1040_VERSION:-latest}` since P17, and nothing
      # ever published that image — CI builds it as `vibe-1040-opentax:ci` to prove the
      # engine runs in it and then throws it away. An operator pulling a release would have
      # got `manifest unknown` for the one service the release is about, and fallen back to
      # building it themselves with two build args they would have had to find.
      #
      # The pin comes from `opentax/pinned.json`, the same file CI builds against, so the
      # published image and the tested image are the same engine by construction rather than
      # by two checksums happening to agree.
      - name: Read the pinned engine release
        id: pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open('opentax/pinned.json'))
          for key in ('tag', 'version', 'asset', 'sha256'):
              print(f"{key}={p[key]}")
          PY

      - name: Engine image metadata
        id: meta-opentax
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-opentax
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Vibe 1040 OpenTax engine
            org.opencontainers.image.description=OpenTax ${{ steps.pin.outputs.version }} (AGPL-3.0-only) behind a dependency-free HTTP wrapper
            org.opencontainers.image.vendor=Kisaes
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push the engine
        uses: docker/build-push-action@v7
        with:
          context: ./opentax
          push: true
          build-args: |
            OPENTAX_VERSION=${{ steps.pin.outputs.tag }}
            OPENTAX_SHA256=${{ steps.pin.outputs.sha256 }}
            OPENTAX_ASSET=${{ steps.pin.outputs.asset }}
          tags: ${{ steps.meta-opentax.outputs.tags }}
          labels: ${{ steps.meta-opentax.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The engine is AGPL v3 and this image conveys it, so the image reporting the version
      # it was pinned to is a licence matter as well as a correctness one: whoever receives
      # the image has to be able to tell which source it corresponds to.
      - name: The published engine is the pinned engine
        run: |
          image=$(echo '${{ steps.meta-opentax.outputs.tags }}' | head -1)
          reported=$(docker run --rm --entrypoint opentax "$image" version)
          echo "engine reports: $reported"
          echo "$reported" | grep -qF '${{ steps.pin.outputs.version }}' || {
            echo "::error::the published engine image reports '$reported', not the pinned ${{ steps.pin.outputs.version }}"
            exit 1
          }

      # A pushed image that nobody can pull is not a release.
      #
      # The Vibe Appliance decides whether an app can be enabled by asking GHCR's
      # anonymous token endpoint whether the image is publicly pullable
      # (console/server.js::checkGhcrPublished). A private package fails that check
      # exactly like a nonexistent one, so v0.0.1 published successfully and was still
      # unusable — the console showed "image not published" and the Enable button stayed
      # disabled. Nothing in the pipeline noticed, because pushing had worked.
      #
      # This step performs the appliance's own check and fails the release if it does not
      # pass, so the failure surfaces here rather than on a droplet weeks later.
      - name: Verify the images are anonymously pullable
        run: |
          fail=0
          owner="${{ github.repository_owner }}"
          for repo in "$owner/vibe-1040" "$owner/vibe-1040-sidecar" "$owner/vibe-1040-opentax"; do
            lower=$(echo "$repo" | tr '[:upper:]' '[:lower:]')
            body=$(curl -sf "https://ghcr.io/token?scope=repository:${lower}:pull" || echo '{}')
            if echo "$body" | grep -q '"token"'; then
              echo "OK   $lower is anonymously pullable"
            else
              echo "FAIL $lower is NOT anonymously pullable"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            {
              echo "### Release incomplete — images are not anonymously pullable"
              echo
              echo "The images pushed, but GHCR will not serve them to an anonymous puller,"
              echo "so the Vibe Appliance console will show **image not published** and the"
              echo "Enable button will stay disabled."
              echo
              echo "**Cause.** A GHCR package inherits its repository's visibility when it is"
              echo "first created, and this repository is private."
              echo
              echo "**Fix — one time, in the web UI.** Package visibility cannot be changed"
              echo "through the REST API; it is a package setting:"
              echo
              echo "- https://github.com/users/${{ github.repository_owner }}/packages/container/vibe-1040/settings"
              echo "- https://github.com/users/${{ github.repository_owner }}/packages/container/vibe-1040-sidecar/settings"
              echo "- https://github.com/users/${{ github.repository_owner }}/packages/container/vibe-1040-opentax/settings"
              echo
              echo "Danger Zone → Change visibility → Public. Visibility is sticky, so every"
              echo "later release stays public and this step passes from then on."
              echo
              echo "The repository itself can stay private. The images carry only compiled"
              echo "code, the built review UI, and the form-schema and mapping data — no docs,"
              echo "no .env, and not the WISP amendment."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "### Images published and anonymously pullable"
            echo
            echo '```'
            echo "${{ steps.meta-api.outputs.tags }}"
            echo "${{ steps.meta-sidecar.outputs.tags }}"
            echo "${{ steps.meta-opentax.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
