name: CI

on:
  push:
    branches: [main]
  pull_request:

# `packages: read` lets GITHUB_TOKEN pull @kisaesdevlab/vibe-auth — provided that package's
# "Manage Actions access" grants this repository. Without the grant the install 403s.
permissions:
  contents: read
  packages: read

env:
  # The SDK is not on a public registry; it is built from the (public) router repository.
  ROUTER_REPO: KisaesDevLab/Vibe-AI-Router

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          # @kisaesdevlab/vibe-auth lives on GitHub Packages, which wants a token even to read.
          # This writes a runner-level npmrc that expands NODE_AUTH_TOKEN at install time.
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kisaesdevlab'

      # §3 — this app reaches AI only through the router. Run first, because a provider
      # hostname landing here is a compliance problem, not a bug.
      - name: Provider-leakage check
        run: node scripts/check-provider-leakage.mjs

      - name: Fetch the router SDK
        uses: actions/checkout@v5
        with:
          repository: ${{ env.ROUTER_REPO }}
          path: .router
          sparse-checkout: packages/sdk

      - name: Install
        run: node scripts/install-deps.mjs --sdk .router/packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          # @kisaesdevlab/vibe-auth lives on GitHub Packages, which wants a token even to read.
          # This writes a runner-level npmrc that expands NODE_AUTH_TOKEN at install time.
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kisaesdevlab'
      - run: npm install --no-audit --no-fund
        working-directory: ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
        working-directory: ui

  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        working-directory: sidecar
      - name: Import and compile check
        run: python -m py_compile triage.py blobstore.py worker.py
        working-directory: sidecar

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyMuPDF Pillow
      # Fixtures are generated deterministically, so a drift here means either the
      # generator or the committed fixtures changed without the other.
      - name: Regenerate fixtures and check for drift
        run: |
          python fixtures/generate.py test/fixtures
          git diff --exit-code --stat test/fixtures/manifest.json
