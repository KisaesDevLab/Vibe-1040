services:
  api:
    image: ghcr.io/kisaesdevlab/vibe-1040:${VIBE_1040_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      # @kisaesdevlab/vibe-auth comes from GitHub Packages; the Dockerfile requires this.
      #   NODE_AUTH_TOKEN=$(gh auth token) docker compose build
      secrets:
        - NODE_AUTH_TOKEN
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [.env]
    ports:
      - "127.0.0.1:8240:8240"
    volumes:
      - blobs:/data/blobs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8240/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [vibe1040, vibe-suite]

  worker:
    image: ghcr.io/kisaesdevlab/vibe-1040:${VIBE_1040_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - NODE_AUTH_TOKEN
    restart: unless-stopped
    command: ["node", "dist/queue/worker.js"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [.env]
    volumes:
      - blobs:/data/blobs
    networks: [vibe1040, vibe-suite]

  sidecar:
    image: ghcr.io/kisaesdevlab/vibe-1040-sidecar:${VIBE_1040_VERSION:-latest}
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    env_file: [.env]
    volumes:
      - blobs:/data/blobs
    networks: [vibe1040]

  # The OpenTax engine (P17, CLAUDE.md §14). Optional: start it only when
  # DRAFT_RETURN_ENABLED is true. Nothing else depends on it, and with it stopped the app
  # degrades and says so at /health rather than failing a bundle.
  #
  # `profiles` keeps it out of a plain `docker compose up`, so a deployment that has not
  # enabled the draft return does not pull or run an engine it will never call:
  #   docker compose --profile draft-return up -d
  #
  # It joins vibe1040 only. It has no database, no Redis, no volume and no secret, and it
  # reaches nothing outside this network — the engine is deterministic and makes no calls.
  opentax:
    image: ghcr.io/kisaesdevlab/vibe-1040-opentax:${VIBE_1040_VERSION:-latest}
    profiles: [draft-return]
    build:
      context: ./opentax
      dockerfile: Dockerfile
      args:
        # Pinned, and checksummed. See opentax/Dockerfile for why this is not optional.
        OPENTAX_VERSION: ${OPENTAX_VERSION:?set OPENTAX_VERSION to a pinned engine release}
        OPENTAX_SHA256: ${OPENTAX_SHA256:?set OPENTAX_SHA256 to that release asset's sha256}
    restart: unless-stopped
    read_only: true
    tmpfs:
      # Returns are computed in a temp directory and deleted with the response. Nothing here
      # needs to persist, and nothing holding taxpayer amounts should be able to.
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8230/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks: [vibe1040]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibe1040
      POSTGRES_PASSWORD: vibe1040
      POSTGRES_DB: vibe1040
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe1040"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vibe1040]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vibe1040]

volumes:
  pgdata:
  redisdata:
  blobs:

networks:
  vibe1040:
  # The router lives on the shared suite network. It is never reached via Caddy.
  vibe-suite:
    external: true

# Build-time only: read from the environment of whoever runs `docker compose build`, mounted
# for the npm install steps, and written to no image layer. Needs read:packages.
secrets:
  NODE_AUTH_TOKEN:
    environment: NODE_AUTH_TOKEN
